<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひとつの芽 — 新しい曲の試聴</title><link rel="icon" type="image/svg+xml" href="../assets/icon.svg"><link rel="stylesheet" href="../style.css?v=0.3.0"><style>main{max-width:540px;margin:8vh auto;padding:1.25rem}h1{font-size:1.8rem}audio{width:100%;margin:1.4rem 0}.sample{padding:1.5rem;border:1px solid #aab49b;border-radius:1rem;background:#e6e1cd}a{color:#285f4f}p{font-size:.9375rem}.links{display:flex;gap:1.2rem;flex-wrap:wrap}</style></head>
<body><main><p class="eyebrow">NEW SONG · LISTENING SAMPLE</p><h1>ひとつの芽</h1><div class="sample"><p>小さな呼びかけが姿を変え、<br>返事として戻る、3拍子の曲。</p><button id="sample-play" class="primary-button" type="button">▷ 曲全体を聴く</button><audio controls preload="metadata" aria-label="新しいひとつの芽、完成曲の試聴"><source src="./sprout-musicbox.wav" type="audio/wav"></audio><p id="audio-status" role="status">再生ボタンで聴けます。画面を離れると停止します。</p></div><p>オルゴール風の新しい1曲を、まず曲全体として聴くための試聴案です。ゲームでは、呼びかけと返事の2つに分けています。</p><p class="links"><a href="./sprout-musicbox.wav" download>WAVを保存</a><a href="../">自由に動かせる宝石の試作へ</a></p></main><script>const a=document.querySelector('audio'),s=document.getElementById('audio-status');document.getElementById('sample-play').addEventListener('click',()=>a.play().catch(()=>s.textContent='再生ボタンでもう一度聴けます。'));a.addEventListener('play',()=>s.textContent='新しい完成曲を再生中。');a.addEventListener('ended',()=>s.textContent='聴いてくれてありがとう。もう一度、自由に聴けます。');document.addEventListener('visibilitychange',()=>{if(document.hidden){a.pause();s.textContent='画面を離れたため停止しました。再生ボタンで聴けます。'}});window.addEventListener('pagehide',()=>a.pause());</script></body></html>
