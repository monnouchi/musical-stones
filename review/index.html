<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>3曲の試聴 — Musical Stones</title><link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
 <link rel="stylesheet" href="../style.css?v=0.4.5">
 <style>main{max-width:680px;margin:2rem auto;padding:0 1rem 2rem}h1{font-size:1.75rem}h2{font-size:1.3rem}p{font-size:.9375rem}.sample{padding:1.2rem;margin:1.2rem 0;border:1px solid #aab49b;border-radius:1rem;background:#e6e1cd}.sample-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;flex-wrap:wrap}.sample-head span{font-size:.8125rem;color:var(--muted)}audio{width:100%;margin:.8rem 0}.sample-controls{display:flex;gap:.5rem;flex-wrap:wrap}.settings{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}a{color:#285f4f}.audio-status{min-height:1.4rem;font-size:.8125rem}footer{font-size:.875rem}</style>
</head>
<body><main>
 <p class="eyebrow">MUSIC BOX · THREE GEMS</p><h1>三つの宝石の音</h1>
 <p>響きはひとつ、音楽は三つ。曲全体を聴いてから、かけらをつなぐゲームへ。</p>
 <div class="settings"><button id="sample-mute" class="quiet-button" type="button" aria-pressed="false">音あり</button><label for="sample-volume">音量</label><input id="sample-volume" type="range" min="0" max="100" value="65"><button id="stop-all" class="quiet-button" type="button">すべて停止</button></div>
 <div id="samples"></div>
 <footer><a href="../">宝石のゲームで遊ぶ</a><p>1曲目の音楽はそのままに、2・3曲目を作り直した3曲の試聴です。</p></footer>
</main><script type="module" src="./samples.js?v=0.4.5"></script></body></html>
